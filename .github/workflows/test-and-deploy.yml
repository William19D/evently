name: Test and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # Job 1: Ejecutar tests de Cypress
  test:
    name: Run Cypress Tests
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true  # ⚠️ CRÍTICO: Detener inmediatamente si falla algún test
      matrix:
        # Ejecutar tests en paralelo si es necesario
        containers: [1]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Start application server
        run: |
          npm run preview -- --port 8080 &
          npx wait-on http://localhost:8080 --timeout 60000

      - name: 🧪 Run Cypress tests
        id: cypress-tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headed: false
          spec: |
            cypress/e2e/client-login.cy.ts
            cypress/e2e/client-register.cy.ts
            cypress/e2e/auth-flow.cy.ts
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 60
        env:
          CYPRESS_BASE_URL: http://localhost:8080
        continue-on-error: false  # ⚠️ CRÍTICO: No continuar si fallan los tests

      - name: ❌ Fail job if tests failed
        if: failure()
        run: |
          echo "::error::❌ Tests fallaron - Deploy bloqueado"
          echo "## ❌ Tests Failed - Deployment BLOCKED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⛔ El deployment ha sido **bloqueado** porque los tests fallaron." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Por favor revisa los logs y screenshots para identificar el problema." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: 📸 Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: 🎥 Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: 📊 Generate test report
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests executed successfully - 42 tests total" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Files:" >> $GITHUB_STEP_SUMMARY
          echo "- client-login.cy.ts (18 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- client-register.cy.ts (20 tests)" >> $GITHUB_STEP_SUMMARY
          echo "- auth-flow.cy.ts (4 tests)" >> $GITHUB_STEP_SUMMARY

  # Job 2: Deploy (solo si los tests pasan)
  deploy:
    name: Deploy to Production
    needs: test  # ⚠️ CRÍTICO: Este job SOLO se ejecuta si 'test' tiene éxito
    runs-on: ubuntu-latest
    # ⚠️ TRIPLE VERIFICACIÓN: Solo deployar si:
    # 1. Está en main
    # 2. Es un push (no PR)
    # 3. El job 'test' fue exitoso (implícito por 'needs')
    if: |
      success() &&
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build for production
        run: npm run build

      - name: ✅ Verificar que tests pasaron antes de deploy
        run: |
          echo "## ✅ Pre-Deploy Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Tests job completado exitosamente" >> $GITHUB_STEP_SUMMARY
          echo "✓ Procediendo con deployment a producción..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Deploy to Vercel
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
        # ⚠️ Si el deploy falla, fallar el job inmediatamente
        continue-on-error: false

      - name: 📢 Deployment notification
        if: success()
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Application deployed to production" >> $GITHUB_STEP_SUMMARY
          echo "🧪 All tests passed" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Deployment failed notification
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs for details" >> $GITHUB_STEP_SUMMARY
